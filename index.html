<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Store Walk Log</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    :root{--bg:#f6f5f8;--surface:#fff;--surface2:#ece7f1;--ink:#0b1a45;--muted:#4a4a4a;--line:#dad4e3;--accent:#6b2e8f;--soft:#efe3f6}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Public Sans',sans-serif}.wrap{max-width:900px;margin:auto;padding:16px 16px 110px}.font-display{font-family:'Big Shoulders Display',sans-serif}.mono{font-family:'IBM Plex Mono',monospace}
    header{position:sticky;top:0;z-index:2;background:var(--bg);padding-bottom:12px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:10px;align-items:center;margin-bottom:12px}.stamp{width:34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center}.eyebrow{display:block;color:var(--muted);font:11px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.08em}.brand h1{margin:0;font-size:28px}
    input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px}input{width:100%}#yourName{margin-bottom:8px;font-size:13px}.project-row{display:flex;gap:8px}.project-row input{flex:1;min-width:0}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer}.outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}.primary{background:var(--ink);color:#fff}.save{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}.status{min-height:18px;margin-top:5px;color:var(--muted);font-size:12px}
    main{padding-top:16px}.adder{width:100%;padding:20px;border:2px dashed var(--accent);border-radius:14px;background:var(--soft);color:var(--accent);font-size:16px;font-weight:700;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:30px 16px;border:1px dashed var(--line);border-radius:14px;margin:18px 0}.empty strong{display:block;color:var(--ink);font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}.thumb{position:relative;aspect-ratio:4/3;background:var(--surface2)}.thumb img{width:100%;height:100%;object-fit:cover}.remove{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;border-radius:50%;background:#17201dcc;color:#fff;cursor:pointer}.badge{position:absolute;left:8px;bottom:8px;padding:3px 8px;border-radius:99px;background:#17201dcc;color:#fff;font-size:11px}.card-body{padding:12px;display:grid;gap:8px}.meta{color:var(--muted);font-size:12px}.location{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0;background:transparent;font-family:'IBM Plex Mono',monospace;font-size:12px}.caption{width:100%;resize:vertical;min-height:48px;font-size:13px}.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.toast{position:fixed;bottom:78px;left:16px;right:16px;max-width:868px;margin:auto;padding:10px 14px;background:var(--ink);color:#fff;border-radius:9px;font-size:13px}[hidden]{display:none!important}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="stamp" aria-hidden="true">＋</div><div><span class="eyebrow">Field Photo Log</span><h1 class="font-display">Store Walk Log</h1></div></div>
    <input id="yourName" placeholder="Your name — shown as who logged this" maxlength="60">
    <div class="project-row"><input id="visitTitle" list="projectList" placeholder="Project name — e.g. Downtown Flagship, Sept 2026" maxlength="120"><button id="openBtn" class="btn outline">Open</button></div>
    <div id="projectStatus" class="status"></div><datalist id="projectList"></datalist>
  </header>
  <main>
    <button id="addBtn" class="adder">＋ Add Photos</button><input id="fileInput" type="file" accept="image/*" multiple hidden>
    <div id="emptyState" class="empty"><strong>No photos yet</strong>Choose photos from this visit. Photo dates are read from metadata when available.</div>
    <div id="grid" class="grid"></div>
  </main>
</div>
<div class="bar"><span id="countLabel"><b>0</b> photos</span><div class="actions"><button id="saveBtn" class="btn save" disabled>Save Project</button><button id="genBtn" class="btn primary" disabled>Generate PowerPoint</button></div></div>
<div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.bundle.js"></script>
<script>
(()=>{
'use strict';
const TARGET=1000000,MAX=2000,DB='store-walk-log',STORE='projects';
const $=id=>document.getElementById(id),photos=[];let seq=0,current=null;
const grid=$('grid'),empty=$('emptyState'),fileInput=$('fileInput'),visitTitle=$('visitTitle'),nameInput=$('yourName');
try{nameInput.value=localStorage.getItem('storeWalkLog:yourName')||''}catch(e){}nameInput.oninput=()=>{try{localStorage.setItem('storeWalkLog:yourName',nameInput.value)}catch(e){}};
function toast(message){const el=$('toast');el.textContent=message;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,4500)}
function slugify(s){return(s||'').trim().toLowerCase()}
function fmtDate(d){return d?d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'Not recorded'}
function fmtBytes(n){if(n<1024)return n+' B';if(n<1e6)return Math.round(n/1024)+' KB';return(n/1048576).toFixed(2)+' MB'}
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'slug'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbGet(slug){const db=await openDb();return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).get(slug);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
async function dbList(){const db=await openDb();return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
async function dbPut(record){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(record);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function refreshList(){try{const list=await dbList();list.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));$('projectList').innerHTML=list.map(p=>`<option value="${(p.displayName||'').replace(/"/g,'&quot;')}">`).join('')}catch(e){}}
function updateStatus(){ $('projectStatus').textContent=current?`"${current.displayName}" · started by ${current.ownerName||'someone'}`:'' }
function releasePhotos(){photos.splice(0).forEach(p=>{if(p.url)URL.revokeObjectURL(p.url)})}
function loadRecord(record){releasePhotos();grid.innerHTML='';(record.photos||[]).forEach(p=>{const blob=p.blob||null;photos.push({id:++seq,file:null,url:blob?URL.createObjectURL(blob):'',blob,takenAt:p.takenAt?new Date(p.takenAt):null,location:p.location||'',caption:p.caption||'',size:p.originalSize||blob?.size||0,compressedSize:p.compressedSize??blob?.size,width:p.width||0,height:p.height||0})});visitTitle.value=record.displayName;current={slug:record.slug,displayName:record.displayName,ownerName:record.ownerName,createdAt:record.createdAt};updateStatus();render()}
$('openBtn').onclick=async()=>{const raw=visitTitle.value.trim(),slug=slugify(raw);if(!slug)return toast('Type a project name first.');if(photos.length&&!confirm('Open this project and replace the current photos?'))return;const r=await dbGet(slug);if(!r)return toast('No project with that name is saved on this device.');loadRecord(r);toast('Project opened.')}
$('addBtn').onclick=()=>fileInput.click();fileInput.onchange=e=>{[...e.target.files].forEach(addPhoto);fileInput.value=''};
async function metadata(file){let takenAt=null,gps='';try{const m=await exifr.parse(file,{gps:true,exif:true,tiff:true,translateValues:true});const d=m?.DateTimeOriginal||m?.CreateDate||m?.ModifyDate;if(d instanceof Date&&!isNaN(d))takenAt=d;if(typeof m?.latitude==='number'&&typeof m?.longitude==='number')gps=`GPS ${Math.abs(m.latitude).toFixed(5)}° ${m.latitude>=0?'N':'S'}, ${Math.abs(m.longitude).toFixed(5)}° ${m.longitude>=0?'E':'W'}`}catch(e){}return{takenAt:takenAt||new Date(file.lastModified),gps}}
async function compress(file){let source;try{source=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){source=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}const sw=source.width||source.naturalWidth,sh=source.height||source.naturalHeight,scale=Math.min(1,MAX/Math.max(sw,sh));let w=Math.round(sw*scale),h=Math.round(sh*scale),q=.85,blob=null;for(let i=0;i<8;i++){const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(source,0,0,w,h);blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(!blob||blob.size<=TARGET)break;if(q>.5)q=+(q-.12).toFixed(2);else{w=Math.round(w*.82);h=Math.round(h*.82);q=.6}}if(source.close)source.close();return{blob,width:w,height:h}}
async function addPhoto(file){const p={id:++seq,file,url:URL.createObjectURL(file),blob:null,takenAt:null,location:'',caption:'',size:file.size,compressedSize:null,width:0,height:0,working:true};photos.push(p);render();const m=await metadata(file);p.takenAt=m.takenAt;p.gps=m.gps;const c=await compress(file);p.blob=c.blob;p.compressedSize=c.blob?.size||null;p.width=c.width;p.height=c.height;p.working=false;render()}
function render(){ $('countLabel').innerHTML=`<b>${photos.length}</b> photo${photos.length===1?'':'s'}`;empty.hidden=photos.length>0;$('saveBtn').disabled=!photos.length;$('genBtn').disabled=!photos.length;const ids=new Set();photos.forEach(p=>{ids.add(p.id);let card=$('card-'+p.id);if(!card){card=document.createElement('article');card.className='card';card.id='card-'+p.id;card.innerHTML=`<div class="thumb"><img><button class="remove" aria-label="Remove photo">×</button><span class="badge mono"></span></div><div class="card-body"><div class="meta"></div><input class="location" placeholder="Add location — store name" maxlength="120"><div class="meta gps"></div><textarea class="caption" placeholder="Caption — what did you notice here?" maxlength="400"></textarea></div>`;grid.append(card);card.querySelector('.remove').onclick=()=>{const i=photos.findIndex(x=>x.id===p.id);if(i>=0){if(photos[i].url)URL.revokeObjectURL(photos[i].url);photos.splice(i,1);render()}};card.querySelector('.location').oninput=e=>p.location=e.target.value;card.querySelector('.caption').oninput=e=>p.caption=e.target.value}card.querySelector('img').src=p.url;card.querySelector('.meta').textContent=p.takenAt?fmtDate(p.takenAt):'No date found';card.querySelector('.location').value=p.location;card.querySelector('.caption').value=p.caption;card.querySelector('.gps').textContent=p.gps||'';card.querySelector('.badge').textContent=p.working?'compressing…':fmtBytes(p.compressedSize||p.size)});[...grid.children].forEach(c=>{if(!ids.has(+c.id.slice(5)))c.remove()})}
$('saveBtn').onclick=async()=>{const name=visitTitle.value.trim(),slug=slugify(name);if(!slug)return toast('Type a project name before saving.');if(photos.some(p=>p.working))return toast('Please wait for photo compression to finish.');const old=await dbGet(slug),now=new Date().toISOString();const record={slug,displayName:name,ownerName:old?.ownerName||nameInput.value.trim()||'Unknown',createdAt:old?.createdAt||now,updatedAt:now,photos:photos.map(p=>({blob:p.blob||p.file,location:p.location,caption:p.caption,gps:p.gps||'',takenAt:p.takenAt?.toISOString()||null,originalSize:p.size,compressedSize:p.compressedSize,width:p.width,height:p.height}))};await dbPut(record);current=record;updateStatus();await refreshList();toast('Project saved on this device.')};
function dataUrl(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)})}
function groups(){const map=new Map();photos.forEach(p=>{const key=(p.location||'').trim().toLowerCase()||'location not noted';if(!map.has(key))map.set(key,{label:p.location.trim()||'Location not noted',items:[]});map.get(key).items.push(p)});return[...map.values()]}
function chunkArray(list,size){const out=[];for(let i=0;i<list.length;i+=size)out.push(list.slice(i,i+size));return out}
function calcPhotoSize(imgW,imgH,maxW,maxH){if(imgW<=0||imgH<=0)return{w:maxW,h:maxH};const scale=Math.min(maxW/imgW,maxH/imgH);return{w:imgW*scale,h:imgH*scale}}
function titleCase(value){return (value||'').replace(/\s+/g,' ').trim() || 'Untitled';}
$('genBtn').onclick=async()=>{if(!photos.length||photos.some(p=>p.working))return toast('Please wait for photo compression to finish.');
  const ppt=new PptxGenJS();
  ppt.layout='LAYOUT_WIDE';
  const NAVY='0B1A45', PURPLE='6B2E8F', PINK='C48FB2', GOLD='D2AB6D', GRAY='4A4A4A', WHITE='FFFFFF';
  const title=visitTitle.value.trim()||'Store Visit Recap';
  let slideNum=1;

  const cover=ppt.addSlide();
  cover.background={color:NAVY};
  cover.addText('DISNEY STORE',{x:.8,y:1,w:10,h:.5,fontSize:18,bold:true,color:WHITE});
  cover.addText(title,{x:.8,y:1.8,w:11,h:1.1,fontSize:34,bold:true,color:GOLD});
  cover.addText('Logged by '+(nameInput.value.trim()||'Unknown'),{x:.8,y:3.1,w:10,h:.4,fontSize:12,color:PINK});
  cover.addText(String(slideNum++),{x:12.15,y:7.1,w:.5,h:.3,color:PINK,align:'right'});

  for(const group of groups()){
    const batches=chunkArray(group.items,4);
    for(const batch of batches){
      const slide=ppt.addSlide();
      slide.background={color:WHITE};
      slide.addText(titleCase(group.label),{x:.7,y:.45,w:11.5,h:.5,fontSize:22,bold:true,color:PURPLE});
      slide.addText(batch.map(p=>fmtDate(p.takenAt)).join(' · '),{x:.7,y:1.05,w:11.5,h:.3,fontSize:10,color:GRAY});
      const columns=2, rows=2, gapX=.42, gapY=.42;
      const cellW=(12.2 - gapX)/columns;
      const cellH=(5.7 - gapY)/rows;
      for(let i=0;i<batch.length;i++){
        const photo=batch[i];
        const col=i%columns,row=Math.floor(i/columns);
        const x=.7 + col*(cellW+gapX);
        const y=1.55 + row*(cellH+gapY);
        const boxW=cellW;
        const boxH=cellH-0.45;
        const imgSize=calcPhotoSize(photo.width||0,photo.height||0,boxW-0.12,boxH-0.18);
        const imgX=x + (boxW - imgSize.w)/2;
        const imgY=y + 0.04;
        const data = await dataUrl(photo.blob || photo.file);
        slide.addImage({data, x:imgX, y:imgY, w:imgSize.w, h:imgSize.h});
        const caption = (photo.caption || 'No caption provided').trim() || 'No caption provided';
        slide.addText(caption,{x:x, y:y+boxH+0.05, w:boxW, h:0.36, fontSize:8.5, color:GRAY, valign:'middle', margin:0, breakLine:true});
      }
      slide.addText(String(slideNum++),{x:12.15,y:7.1,w:.5,h:.3,color:GRAY,align:'right'});
    }
  }

  const blob=await ppt.write({outputType:'blob'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(title.replace(/[\\/:*?\"<>|]+/g,' ').slice(0,80)||'Store Visit')+'.pptx';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('PowerPoint downloaded.');
};
refreshList();render();
})();
</script>
</body>
</html>
