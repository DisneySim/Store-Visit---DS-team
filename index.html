<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);}</style>
<title>Store Walk Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --bg:#F6F5F8; --surface:#FFFFFF; --surface-2:#ECE7F1;
    --ink:#0B1A45; --muted:#4A4A4A; --line:#DAD4E3;
    --accent:#6B2E8F; --accent-ink:#FFFFFF; --accent-soft:#EFE3F6;
    --accent-2:#0B1A45; --accent-2-soft:#E4E7F0;
    --danger:#B3261E; --danger-soft:#F6DEDB;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B1223; --surface:#141B33; --surface-2:#1D274A;
      --ink:#EEECF4; --muted:#B7B2C6; --line:#2B3560;
      --accent:#B98FD1; --accent-ink:#1A0F2E; --accent-soft:#281C3E;
      --accent-2:#7C93C9; --accent-2-soft:#20263F;
      --danger:#F2897C; --danger-soft:#3A211E;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B1223; --surface:#141B33; --surface-2:#1D274A;
    --ink:#EEECF4; --muted:#B7B2C6; --line:#2B3560;
    --accent:#B98FD1; --accent-ink:#1A0F2E; --accent-soft:#281C3E;
    --accent-2:#7C93C9; --accent-2-soft:#20263F;
    --danger:#F2897C; --danger-soft:#3A211E;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px; line-height:1.45;
  }
  .wrap{max-width:900px; margin:0 auto; padding:0 16px 96px;}
  .font-display{font-family:'Big Shoulders Display','Arial Narrow',sans-serif; letter-spacing:.01em;}
  .font-mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace; font-variant-numeric:tabular-nums;}

  header.top{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--bg); padding:16px 0 12px; border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .stamp{
    width:34px; height:34px; border-radius:8px; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .brand h1{
    font-family:'Big Shoulders Display',sans-serif; font-weight:700;
    font-size:clamp(22px,5.5vw,28px); margin:0; letter-spacing:.01em;
  }
  .brand .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); display:block; margin-bottom:1px;
  }
  #visitTitle, #yourName{
    width:100%; border:1px solid var(--line); border-radius:10px; background:var(--surface);
    color:var(--ink); padding:10px 12px; font-size:15px; font-weight:600;
  }
  #visitTitle::placeholder, #yourName::placeholder{color:var(--muted); font-weight:500;}
  #yourName{font-size:13.5px; padding:8px 12px; margin-bottom:8px;}

  .projectRow{display:flex; gap:8px;}
  .projectRow input{flex:1; min-width:0;}
  .secondaryBtn{
    border:1.5px solid var(--accent); background:transparent; color:var(--accent);
    border-radius:10px; padding:0 16px; font-weight:700; font-size:13.5px; cursor:pointer; white-space:nowrap;
  }
  .secondaryBtn:disabled{opacity:.5; cursor:not-allowed;}
  .projectStatus{font-size:12px; color:var(--muted); min-height:15px; margin-top:6px;}

  .confirmPanel{
    margin-top:10px; padding:12px; border:1px solid var(--danger); background:var(--danger-soft);
    border-radius:10px; font-size:13px; color:var(--ink);
  }
  .confirmActions{display:flex; gap:8px; margin-top:8px;}
  .confirmActions button{
    border-radius:8px; padding:8px 14px; font-weight:700; font-size:13px; cursor:pointer; border:none;
  }
  #confirmCancel{background:var(--surface-2); color:var(--ink);}
  #confirmProceed{background:var(--danger); color:#fff;}

  main{padding-top:16px;}

  .adder{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    border:2px dashed var(--accent); border-radius:14px; background:var(--accent-soft);
    color:var(--accent); font-weight:700; font-size:16px; padding:20px 16px; margin-bottom:20px;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .adder:active{transform:scale(.99);}
  .adder svg{flex:none;}

  .empty{
    text-align:center; color:var(--muted); padding:32px 16px; border:1px dashed var(--line);
    border-radius:14px; margin-bottom:20px;
  }
  .empty strong{display:block; color:var(--ink); font-size:16px; margin-bottom:4px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-bottom:24px;}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .thumbwrap{position:relative; aspect-ratio:4/3; background:var(--surface-2);}
  .thumbwrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .removeBtn{
    position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%;
    background:rgba(20,27,24,.55); color:#fff; border:none; display:flex; align-items:center; justify-content:center;
    cursor:pointer; backdrop-filter:blur(2px);
  }
  .sizeBadge{
    position:absolute; left:8px; bottom:8px; font-size:11px; padding:3px 8px; border-radius:999px;
    background:rgba(20,27,24,.6); color:#fff; letter-spacing:.02em;
  }
  .sizeBadge.ready{background:var(--accent-soft); color:var(--accent);}
  .sizeBadge.warn{background:var(--accent-2-soft); color:var(--accent-2);}

  .cardBody{padding:12px 14px 14px; display:flex; flex-direction:column; gap:8px;}
  .metaRow{display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12.5px;}
  .metaRow svg{flex:none; opacity:.8;}
  .metaRow input{
    flex:1; min-width:0; border:none; background:transparent; color:var(--ink); font-size:12.5px;
    font-family:'IBM Plex Mono',monospace; padding:2px 0;
  }
  .metaRow input::placeholder{color:var(--muted); font-family:'Public Sans',sans-serif;}
  .metaRow input:focus{outline:none; border-bottom:1px solid var(--accent);}
  .noDate{font-style:italic;}
  .gpsHint{display:block; font-size:11px; color:var(--muted); opacity:.75; margin:-4px 0 0 19px;}

  textarea.caption{
    resize:none; border:1px solid var(--line); border-radius:8px; background:var(--surface);
    color:var(--ink); padding:8px 10px; font-size:13.5px; font-family:inherit; min-height:44px;
  }
  textarea.caption:focus{outline:none; border-color:var(--accent);}
  textarea.caption::placeholder{color:var(--muted);}

  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
    background:var(--surface); border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .bottombar .count{font-size:13px; color:var(--muted);}
  .bottombar .count b{color:var(--ink); font-family:'IBM Plex Mono',monospace;}
  .bottomActions{display:flex; gap:8px; flex-wrap:wrap;}
  .genBtn, .saveBtn{
    border-radius:10px; padding:12px 20px; font-weight:700; font-size:14.5px; cursor:pointer; white-space:nowrap;
    display:flex; align-items:center; gap:8px;
  }
  .genBtn{ background:var(--accent-2); color:var(--accent-ink); border:none; }
  .saveBtn{ background:transparent; color:var(--accent-2); border:1.5px solid var(--accent-2); }
  .genBtn:disabled, .saveBtn:disabled{opacity:.5; cursor:not-allowed;}
  .spinner{
    width:15px; height:15px; border-radius:50%; border:2px solid rgba(255,255,255,.4);
    border-top-color:currentColor; animation:spin .7s linear infinite; flex:none;
  }
  @media (prefers-reduced-motion:reduce){.spinner{animation:none;}}
  @keyframes spin{to{transform:rotate(360deg);}}

  .toast{
    position:fixed; left:16px; right:16px; bottom:76px; z-index:30; max-width:868px; margin:0 auto;
    background:var(--ink); color:var(--bg); padding:10px 14px; border-radius:10px; font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
  }
  .toast.error{background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger);}
  [hidden]{display:none!important;}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="stamp" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h2.2l1-1.6A1.5 1.5 0 0 1 11 3.7h2a1.5 1.5 0 0 1 1.3.7l1 1.6h2.2A2.5 2.5 0 0 1 20 8.5v9A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5v-9Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="13.5" r="3" stroke="currentColor" stroke-width="1.5"/></svg>
      </div>
      <div>
        <span class="eyebrow">Field Photo Log</span>
        <h1 class="font-display">Store Walk Log</h1>
      </div>
    </div>
    <input id="yourName" type="text" placeholder="Your name — shown as who logged this" maxlength="60">
    <div class="projectRow">
      <input id="visitTitle" type="text" list="projectList" placeholder="Project name — e.g. Downtown Flagship, Sept 2026" maxlength="120">
      <button id="openBtn" type="button" class="secondaryBtn">Open</button>
    </div>
    <div class="projectStatus" id="projectStatus"></div>
    <datalist id="projectList"></datalist>
    <div class="confirmPanel" id="confirmPanel" hidden>
      <span id="confirmMsg"></span>
      <div class="confirmActions">
        <button id="confirmCancel" type="button">Cancel</button>
        <button id="confirmProceed" type="button">Open anyway</button>
      </div>
    </div>
  </header>

  <main>
    <button class="adder" id="addBtn" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      Add Photos
    </button>
    <input id="fileInput" type="file" accept="image/*" multiple hidden>

    <div class="empty" id="emptyState">
      <strong>No photos yet</strong>
      Tap "Add Photos" to pick shots from this visit. Date comes straight from each photo's metadata — type a location for each, and photos sharing the same location land on one slide together.
    </div>

    <div class="grid" id="grid"></div>
    <datalist id="locList"></datalist>
  </main>
</div>

<div class="bottombar">
  <span class="count" id="countLabel"><b>0</b> photos</span>
  <div class="bottomActions">
    <button class="saveBtn" id="saveBtn" type="button" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 4a1 1 0 0 1 1-1h9.17a1 1 0 0 1 .7.3l2.83 2.83a1 1 0 0 1 .3.7V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4Z" stroke="currentColor" stroke-width="1.5"/><path d="M9 9h6M9 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Save Project
    </button>
    <button class="genBtn" id="genBtn" type="button" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Generate PowerPoint
    </button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.bundle.js"></script>
<script>
(function(){
  "use strict";
  const TARGET_BYTES = 1000 * 1000;
  const MAX_DIM = 2000;

  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('emptyState');
  const fileInput = document.getElementById('fileInput');
  const addBtn = document.getElementById('addBtn');
  const genBtn = document.getElementById('genBtn');
  const saveBtn = document.getElementById('saveBtn');
  const openBtn = document.getElementById('openBtn');
  const countLabel = document.getElementById('countLabel');
  const visitTitle = document.getElementById('visitTitle');
  const yourNameInput = document.getElementById('yourName');
  const projectStatusEl = document.getElementById('projectStatus');
  const projectListEl = document.getElementById('projectList');
  const confirmPanel = document.getElementById('confirmPanel');
  const confirmMsg = document.getElementById('confirmMsg');
  const confirmCancel = document.getElementById('confirmCancel');
  const confirmProceed = document.getElementById('confirmProceed');
  const toastEl = document.getElementById('toast');

  const photos = [];
  let seq = 0;
  let waveBannerDataUrl = null;
  let currentProject = null;
  let pendingOpenSlug = null;
  const hasIndexedDB = typeof indexedDB !== 'undefined';

  fetch('wave-banner.png').then(r => r.blob()).then(blobToDataURL).then(url => { waveBannerDataUrl = url; }).catch(() => {});

  try {
    yourNameInput.value = localStorage.getItem('storeWalkLog:yourName') || '';
  } catch (e) {}
  yourNameInput.addEventListener('input', () => {
    try { localStorage.setItem('storeWalkLog:yourName', yourNameInput.value); } catch (e) {}
  });

  const IDB_NAME = 'store-walk-log';
  const IDB_STORE = 'projects';

  function openIdb(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, { keyPath: 'slug' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function dbGetProject(slug){
    const db = await openIdb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(slug);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }
  async function dbPutProject(record){
    const db = await openIdb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(record);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function dbListProjects(){
    const db = await openIdb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  function slugify(name){
    return (name || '').trim().toLowerCase();
  }

  async function refreshProjectList(){
    if (!hasIndexedDB) return;
    try {
      const list = await dbListProjects();
      list.sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
      projectListEl.innerHTML = list.map(r => `<option value="${(r.displayName || r.slug).replace(/"/g, '&quot;')}">`).join('');
    } catch (e) {}
  }

  function updateProjectStatus(){
    if (!hasIndexedDB) {
      projectStatusEl.textContent = "Saving projects isn't supported in this browser.";
      return;
    }
    if (!currentProject) { projectStatusEl.textContent = ''; return; }
    const started = currentProject.createdAt ? fmtDate(new Date(currentProject.createdAt)) : '';
    projectStatusEl.textContent = `"${currentProject.displayName}" · started by ${currentProject.ownerName || 'someone'}${started ? ' · ' + started : ''}`;
  }

  async function loadProject(slug, rawNameTyped){
    openBtn.disabled = true;
    const original = openBtn.textContent;
    openBtn.textContent = 'Opening…';
    try {
      const record = await dbGetProject(slug);
      if (!record) {
        showToast(`No saved project named "${rawNameTyped}" on this device.`, true);
        return;
      }
      photos.splice(0, photos.length).forEach(p => { if (p.displayUrl && p.displayUrl.startsWith('blob:')) URL.revokeObjectURL(p.displayUrl); });
      grid.innerHTML = '';
      (record.photos || []).forEach(sp => {
        const id = ++seq;
        const blob = sp.blob || null;
        photos.push({
          id, file: null,
          displayUrl: blob ? URL.createObjectURL(blob) : '',
          originalSize: sp.originalSize || (blob ? blob.size : 0),
          takenAt: sp.takenAt ? new Date(sp.takenAt) : null,
          usedFallbackDate: !!sp.usedFallbackDate,
          location: sp.location || '', caption: sp.caption || '', gps: sp.gps || '',
          compressing: false, compressedBlob: blob, compressedSize: sp.compressedSize != null ? sp.compressedSize : (blob ? blob.size : null),
          compressFailed: !blob,
          imgWidth: sp.imgWidth || 0, imgHeight: sp.imgHeight || 0,
          addedByName: sp.addedByName || ''
        });
      });
      visitTitle.value = record.displayName || rawNameTyped;
      currentProject = { slug: record.slug, displayName: record.displayName, ownerName: record.ownerName, createdAt: record.createdAt };
      updateProjectStatus();
      render();
      renderLocList();
      const n = (record.photos || []).length;
      showToast(`Opened "${record.displayName}" — ${n} photo${n === 1 ? '' : 's'} loaded.`);
    } catch (e) {
      showToast("Couldn't open that project on this device.", true);
    } finally {
      openBtn.disabled = !hasIndexedDB;
      openBtn.textContent = original;
    }
  }

  openBtn.addEventListener('click', async () => {
    if (!hasIndexedDB) return;
    const raw = visitTitle.value.trim();
    const slug = slugify(raw);
    if (!slug) { showToast('Type a project name first.', true); return; }
    if (photos.length > 0) {
      pendingOpenSlug = slug;
      confirmMsg.textContent = `Opening "${raw}" will replace your ${photos.length} unsaved photo${photos.length === 1 ? '' : 's'} here. Save first if you want to keep them.`;
      confirmPanel.hidden = false;
      return;
    }
    await loadProject(slug, raw);
  });

  confirmCancel.addEventListener('click', () => { confirmPanel.hidden = true; pendingOpenSlug = null; });
  confirmProceed.addEventListener('click', async () => {
    confirmPanel.hidden = true;
    const slug = pendingOpenSlug; pendingOpenSlug = null;
    if (slug) await loadProject(slug, visitTitle.value.trim());
  });

  saveBtn.addEventListener('click', async () => {
    if (!hasIndexedDB) return;
    const raw = visitTitle.value.trim();
    const slug = slugify(raw);
    if (!slug) { showToast('Type a project name before saving.', true); return; }
    if (photos.length === 0) { showToast('Add at least one photo before saving.', true); return; }

    saveBtn.disabled = true;
    const original = saveBtn.innerHTML;
    saveBtn.innerHTML = '<span class="spinner"></span> Saving…';
    try {
      if (photos.some(p => p.compressing)) {
        saveBtn.innerHTML = '<span class="spinner"></span> Finishing compression…';
        await new Promise(resolve => {
          const check = setInterval(() => { if (!photos.some(p => p.compressing)) { clearInterval(check); resolve(); } }, 200);
        });
      }
      const existing = await dbGetProject(slug);
      const nowIso = new Date().toISOString();
      const ownerName = existing ? existing.ownerName : (yourNameInput.value.trim() || 'Unknown');
      const record = {
        slug, displayName: raw, ownerName,
        createdAt: existing ? existing.createdAt : nowIso,
        updatedAt: nowIso,
        photos: photos.map(p => ({
          blob: p.compressedBlob || p.file || null,
          caption: p.caption || '', location: p.location || '', gps: p.gps || '',
          takenAt: p.takenAt ? p.takenAt.toISOString() : null,
          usedFallbackDate: !!p.usedFallbackDate,
          imgWidth: p.imgWidth || 0, imgHeight: p.imgHeight || 0,
          originalSize: p.originalSize || 0, compressedSize: p.compressedSize || null,
          addedByName: p.addedByName || ''
        }))
      };
      await dbPutProject(record);
      currentProject = { slug, displayName: raw, ownerName, createdAt: record.createdAt };
      updateProjectStatus();
      await refreshProjectList();
      showToast('Project saved on this device.');
    } catch (e) {
      showToast("Couldn't save — this browser may be low on storage.", true);
    } finally {
      saveBtn.disabled = photos.length === 0 || !hasIndexedDB;
      saveBtn.innerHTML = original;
    }
  });

  refreshProjectList();
  updateProjectStatus();

  addBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    files.forEach(addPhoto);
    fileInput.value = '';
  });

  function fmtBytes(n){
    if (n == null) return '…';
    if (n < 1024) return n + ' B';
    const kb = n / 1024;
    if (kb < 1000) return Math.round(kb) + ' KB';
    return (kb/1024).toFixed(2) + ' MB';
  }

  function fmtDate(d){
    if (!d) return null;
    try {
      return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
    } catch(e){ return null; }
  }

  function fmtCoords(lat, lon){
    const ns = lat >= 0 ? 'N' : 'S';
    const ew = lon >= 0 ? 'E' : 'W';
    return `${Math.abs(lat).toFixed(5)}° ${ns}, ${Math.abs(lon).toFixed(5)}° ${ew}`;
  }

  async function readMetadata(file){
    let takenAt = null, gpsText = '', usedFallbackDate = false;
    try {
      const meta = await exifr.parse(file, { gps: true, exif: true, tiff: true, translateValues: true });
      const d = meta?.DateTimeOriginal || meta?.CreateDate || meta?.ModifyDate || null;
      if (d instanceof Date && !isNaN(d)) takenAt = d;
      if (typeof meta?.latitude === 'number' && typeof meta?.longitude === 'number') {
        gpsText = fmtCoords(meta.latitude, meta.longitude);
      }
    } catch (err) {}
    if (!takenAt && file.lastModified) {
      takenAt = new Date(file.lastModified);
      usedFallbackDate = true;
    }
    return { takenAt, gpsText, usedFallbackDate };
  }

  function renderLocList(){
    const seen = new Set();
    const options = [];
    photos.forEach(p => {
      const v = (p.location || '').trim();
      if (v && !seen.has(v.toLowerCase())) { seen.add(v.toLowerCase()); options.push(v); }
    });
    document.getElementById('locList').innerHTML = options.map(v => `<option value="${v.replace(/"/g,'&quot;')}">`).join('');
  }

  function groupByLocation(list){
    const groups = new Map();
    list.forEach(p => {
      const key = (p.location || '').trim().toLowerCase();
      if (!groups.has(key)) groups.set(key, { label: (p.location || '').trim() || 'Location not noted', items: [] });
      groups.get(key).items.push(p);
    });
    return Array.from(groups.values());
  }

  function chunkArray(arr, size){
    const out = [];
    for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  }

  async function getOrientedBitmap(file){
    try {
      return await createImageBitmap(file, { imageOrientation: 'from-image' });
    } catch (e) {
      return await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }
  }

  function drawToCanvas(source, w, h){
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(source, 0, 0, w, h);
    return canvas;
  }

  function canvasToBlob(canvas, quality){
    return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
  }

  async function compressImage(file){
    let source;
    try {
      source = await getOrientedBitmap(file);
    } catch (e) {
      return { blob: null, width: 0, height: 0, failed: true };
    }
    const srcW = source.width || source.naturalWidth;
    const srcH = source.height || source.naturalHeight;
    const scale0 = Math.min(1, MAX_DIM / Math.max(srcW, srcH));
    let w = Math.round(srcW * scale0), h = Math.round(srcH * scale0);
    let quality = 0.85;
    let blob = null;

    for (let i = 0; i < 8; i++) {
      const canvas = drawToCanvas(source, w, h);
      blob = await canvasToBlob(canvas, quality);
      if (!blob) break;
      if (blob.size <= TARGET_BYTES) break;
      if (quality > 0.5) quality = +(quality - 0.12).toFixed(2);
      else { w = Math.round(w * 0.82); h = Math.round(h * 0.82); quality = 0.6; }
    }
    if (source.close) source.close();
    return { blob, width: w, height: h, failed: !blob };
  }

  function blobToDataURL(blob){
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  function svgIcon(name){
    const icons = {
      calendar: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.5"/></svg>',
      pin: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.8 7-12a7 7 0 1 0-14 0c0 5.2 7 12 7 12Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9" r="1.5" fill="currentColor"/></svg>',
    };
    return icons[name] || '';
  }

  function render(){
    countLabel.innerHTML = `<b>${photos.length}</b> photo${photos.length===1?'':'s'}`;
    emptyState.hidden = photos.length > 0;
    genBtn.disabled = photos.length === 0;
    saveBtn.disabled = photos.length === 0 || !hasIndexedDB;
    openBtn.disabled = !hasIndexedDB;

    const known = new Set();
    photos.forEach(p => {
      known.add(p.id);
      let card = document.getElementById('card-' + p.id);
      if (!card) {
        card = document.createElement('div');
        card.className = 'card';
        card.id = 'card-' + p.id;
        card.innerHTML = `
          <div class="thumbwrap">
            <img id="img-${p.id}">
            <button class="removeBtn" data-remove="${p.id}" aria-label="Remove photo" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            </button>
            <span class="sizeBadge font-mono" id="size-${p.id}"></span>
          </div>
          <div class="cardBody">
            <label class="metaRow">${svgIcon('calendar')}<span id="date-${p.id}"></span></label>
            <label class="metaRow">${svgIcon('pin')}<input id="loc-${p.id}" type="text" list="locList" placeholder="Add location — store name" maxlength="120"></label>
            <span class="gpsHint font-mono" id="gps-${p.id}"></span>
            <textarea class="caption" id="cap-${p.id}" placeholder="Caption — what did you notice here?" maxlength="400" rows="2"></textarea>
          </div>`;
        grid.appendChild(card);
        card.querySelector('[data-remove]').addEventListener('click', () => removePhoto(p.id));
        const locEl = card.querySelector('#loc-'+p.id);
        locEl.value = p.location || '';
        locEl.addEventListener('input', (e) => { p.location = e.target.value; renderLocList(); });
        const capEl = card.querySelector('#cap-'+p.id);
        capEl.value = p.caption || '';
        capEl.addEventListener('input', (e) => { p.caption = e.target.value; });
      }
      const img = document.getElementById('img-' + p.id);
      if (img.getAttribute('src') !== p.displayUrl) img.src = p.displayUrl;

      const dateEl = document.getElementById('date-' + p.id);
      if (p.takenAt) {
        dateEl.textContent = fmtDate(p.takenAt) + (p.usedFallbackDate ? ' (file date)' : '');
        dateEl.classList.toggle('noDate', !!p.usedFallbackDate);
      } else {
        dateEl.textContent = 'No date found';
        dateEl.classList.add('noDate');
      }

      const gpsEl = document.getElementById('gps-' + p.id);
      gpsEl.textContent = p.gps ? 'GPS ' + p.gps : '';
      gpsEl.hidden = !p.gps;

      const sizeEl = document.getElementById('size-' + p.id);
      sizeEl.classList.remove('ready', 'warn');
      if (p.compressing) {
        sizeEl.textContent = 'compressing…';
      } else if (p.compressFailed) {
        sizeEl.textContent = fmtBytes(p.originalSize) + ' (original)';
        sizeEl.classList.add('warn');
      } else if (p.compressedSize != null) {
        sizeEl.textContent = fmtBytes(p.compressedSize);
        sizeEl.classList.add('ready');
      } else {
        sizeEl.textContent = fmtBytes(p.originalSize);
      }
    });

    Array.from(grid.children).forEach(child => {
      const id = Number(child.id.replace('card-', ''));
      if (!known.has(id)) child.remove();
    });
  }

  function removePhoto(id){
    const idx = photos.findIndex(p => p.id === id);
    if (idx === -1) return;
    const [p] = photos.splice(idx, 1);
    if (p.displayUrl && p.displayUrl.startsWith('blob:')) URL.revokeObjectURL(p.displayUrl);
    render();
  }

  async function addPhoto(file){
    const id = ++seq;
    const p = {
      id, file,
      displayUrl: URL.createObjectURL(file),
      originalSize: file.size,
      takenAt: null, usedFallbackDate: false,
      location: '', caption: '', gps: '',
      compressing: true, compressedBlob: null, compressedSize: null, compressFailed: false,
      imgWidth: 0, imgHeight: 0, addedByName: yourNameInput.value.trim()
    };
    photos.push(p);
    render();

    const meta = await readMetadata(file);
    p.takenAt = meta.takenAt;
    p.usedFallbackDate = meta.usedFallbackDate;
    p.gps = meta.gpsText;
    render();

    const result = await compressImage(file);
    p.compressing = false;
    if (result.failed) {
      p.compressFailed = true;
    } else {
      p.compressedBlob = result.blob;
      p.compressedSize = result.blob.size;
      p.imgWidth = result.width;
      p.imgHeight = result.height;
    }
    render();
  }

  function showToast(msg, isError){
    toastEl.textContent = msg;
    toastEl.classList.toggle('error', !!isError);
    toastEl.hidden = false;
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => { toastEl.hidden = true; }, 5000);
  }

  function sanitizeFilename(name){
    return (name || 'Store Visit').replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 80) || 'Store Visit';
  }

  async function downloadFile(filename, blob){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 100);
  }

  async function buildDeck(){
    const pptx = new PptxGenJS();
    pptx.defineLayout({ name: 'WIDE', width: 13.33, height: 7.5 });
    pptx.layout = 'WIDE';

    const NAVY = '0B1A45', PURPLE = '6B2E8F', PINK = 'C48FB2', GOLD = 'D2AB6D', GRAY = '4A4A4A', WHITE = 'FFFFFF';
    const FONT = 'Calibri';

    function addWaveImage(slide, x, y, w, h){
      if (waveBannerDataUrl) {
        slide.addImage({ data: waveBannerDataUrl, x, y, w, h, sizing: { type: 'cover', w, h } });
      } else {
        slide.addShape(pptx.ShapeType.rect, { x, y, w, h, fill: { color: NAVY } });
      }
    }

    function addPhotoContain(slide, dataUrl, imgW, imgH, boxX, boxY, boxW, boxH){
      let w = boxW, h = boxH;
      if (imgW > 0 && imgH > 0) {
        const scale = Math.min(boxW / imgW, boxH / imgH);
        w = imgW * scale;
        h = imgH * scale;
      }
      const x = boxX + (boxW - w) / 2;
      const y = boxY + (boxH - h) / 2;
      slide.addImage({ data: dataUrl, x, y, w, h });
    }

    function addFooter(slide, pageNum, onDark){
      const col = onDark ? PINK : GRAY;
      slide.addText('DISNEY STORE  ·  STORE VISIT LOG', { x: 0.5, y: 7.12, w: 8, h: 0.3, fontFace: FONT, fontSize: 9, color: col, charSpacing: 1 });
      slide.addText(String(pageNum), { x: 12.33, y: 7.12, w: 0.5, h: 0.3, fontFace: FONT, fontSize: 9, color: col, align: 'right' });
    }

    function dateRangeText(list){
      const d = list.filter(Boolean).sort((a, b) => a - b);
      if (!d.length) return '';
      return d[0].toDateString() === d[d.length - 1].toDateString()
        ? d[0].toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })
        : `${d[0].toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} – ${d[d.length - 1].toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`;
    }

    let pageNum = 1;
    const title = visitTitle.value.trim() || 'Store Visit Recap';
    const allDates = photos.map(p => p.takenAt).filter(Boolean);

    const titleSlide = pptx.addSlide();
    titleSlide.background = { color: NAVY };
    addWaveImage(titleSlide, 0, 5.55, 13.33, 1.95);
    titleSlide.addText('DISNEY STORE', { x: 0.9, y: 0.95, w: 9, h: 0.5, fontFace: FONT, fontSize: 18, bold: true, color: WHITE, charSpacing: 3 });
    titleSlide.addText(title, { x: 0.9, y: 1.65, w: 11.5, h: 1.3, fontFace: FONT, fontSize: 40, bold: true, color: GOLD });
    titleSlide.addText(dateRangeText(allDates), { x: 0.9, y: 2.85, w: 11.5, h: 0.4, fontFace: FONT, fontSize: 14, color: PINK });
    const loggedByName = (currentProject && currentProject.ownerName) || yourNameInput.value.trim();
    if (loggedByName) {
      titleSlide.addText('Logged by ' + loggedByName, { x: 0.9, y: 3.3, w: 11.5, h: 0.35, fontFace: FONT, fontSize: 12, color: PINK });
    }
    addFooter(titleSlide, pageNum++, true);

    const groups = groupByLocation(photos);
    for (const group of groups) {
      const chunks = chunkArray(group.items, 4);
      for (let ci = 0; ci < chunks.length; ci++) {
        const chunkItems = chunks[ci];
        const slide = pptx.addSlide();
        slide.background = { color: WHITE };
        addWaveImage(slide, 0, 0, 13.33, 0.55);

        const headline = group.label.toUpperCase() + (chunks.length > 1 ? ` (CONT. ${ci + 1}/${chunks.length})` : '');
        slide.addText(headline, { x: 0.6, y: 0.75, w: 12.1, h: 0.5, fontFace: FONT, fontSize: 24, bold: true, color: PURPLE, charSpacing: 1 });

        const rangeTxt = dateRangeText(chunkItems.map(p => p.takenAt));
        slide.addText(rangeTxt, { x: 0.6, y: 1.28, w: 12.1, h: 0.35, fontFace: FONT, fontSize: 12, color: GRAY });

        const gx = 0.6, gy = 1.8, gw = 12.13, gh = 5.0, gap = 0.22;

        if (chunkItems.length === 1) {
          const p = chunkItems[0];
          const dataUrl = await blobToDataURL(p.compressedBlob || p.file);
          const imgW = 7.0;
          addPhotoContain(slide, dataUrl, p.imgWidth, p.imgHeight, gx, gy, imgW, gh);
          slide.addShape(pptx.ShapeType.rect, { x: gx + imgW + 0.22, y: gy, w: 0.02, h: gh, fill: { color: PINK } });
          const rx = gx + imgW + 0.5, rw = gx + gw - rx;
          let ry = gy;
          slide.addText('DATE TAKEN', { x: rx, y: ry, w: rw, h: 0.3, fontFace: FONT, fontSize: 10, bold: true, color: GRAY, charSpacing: 1.5 });
          ry += 0.32;
          slide.addText(p.takenAt ? fmtDate(p.takenAt) : 'Not recorded', { x: rx, y: ry, w: rw, h: 0.4, fontFace: FONT, fontSize: 13, color: NAVY });
          ry += 0.65;
          if (p.caption) {
            slide.addText('NOTES', { x: rx, y: ry, w: rw, h: 0.3, fontFace: FONT, fontSize: 10, bold: true, color: GRAY, charSpacing: 1.5 });
            ry += 0.32;
            slide.addText(p.caption, { x: rx, y: ry, w: rw, h: gy + gh - ry, fontFace: FONT, fontSize: 13, color: NAVY, valign: 'top' });
          }
        } else {
          const cols = chunkItems.length <= 2 ? chunkItems.length : 2;
          const rows = Math.ceil(chunkItems.length / cols);
          const cellW = (gw - gap * (cols - 1)) / cols;
          const cellH = (gh - gap * (rows - 1)) / rows;
          for (let idx = 0; idx < chunkItems.length; idx++) {
            const p = chunkItems[idx];
            const col = idx % cols, row = Math.floor(idx / cols);
            const cx = gx + col * (cellW + gap);
            const cy = gy + row * (cellH + gap);
            const imgH = cellH - 0.42;
            const dataUrl = await blobToDataURL(p.compressedBlob || p.file);
            addPhotoContain(slide, dataUrl, p.imgWidth, p.imgHeight, cx, cy, cellW, imgH);
            slide.addText(p.caption || 'No caption', { x: cx, y: cy + imgH + 0.04, w: cellW, h: 0.36, fontFace: FONT, fontSize: 10, color: GRAY, valign: 'top' });
          }
        }

        addFooter(slide, pageNum++, false);
      }
    }

    return pptx.write({ outputType: 'blob' });
  }

  genBtn.addEventListener('click', async () => {
    if (photos.length === 0) return;

    genBtn.disabled = true;
    const originalHtml = genBtn.innerHTML;
    genBtn.innerHTML = '<span class="spinner"></span> Building deck…';

    try {
      const stillCompressing = photos.some(p => p.compressing);
      if (stillCompressing) {
        genBtn.innerHTML = '<span class="spinner"></span> Finishing photo compression…';
        await new Promise(resolve => {
          const check = setInterval(() => {
            if (!photos.some(p => p.compressing)) { clearInterval(check); resolve(); }
          }, 200);
        });
        genBtn.innerHTML = '<span class="spinner"></span> Building deck…';
      }

      const blob = await buildDeck();
      const filename = sanitizeFilename(visitTitle.value.trim() || 'Store Visit') + '.pptx';
      await downloadFile(filename, blob);
      showToast('PowerPoint downloaded successfully!');
    } catch (err) {
      console.error('PowerPoint generation error:', err);
      showToast("Couldn't build the PowerPoint — try again.", true);
    } finally {
      genBtn.disabled = photos.length === 0;
      genBtn.innerHTML = originalHtml;
    }
  });

  render();
})();
</script>
